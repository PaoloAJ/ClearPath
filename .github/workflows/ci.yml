name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    name: Mobile (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  routing:
    name: Routing (vet, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/routing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/routing/go.mod
          cache-dependency-path: services/routing/go.sum
      - run: go vet ./...
      - run: go test ./...

  database:
    name: Database (migrations, seed, RLS tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # seed.sql is generated from data/campus. Fail if it was hand-edited or not rebuilt.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm seed:build
      - run: git diff --exit-code supabase/seed.sql
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase db reset
      - run: supabase test db
